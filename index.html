<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Sumário executivo de risco</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f7;--card:#fff;--ink:#14212b;--mut:#5d6b76;--line:#dbe1e6;--a:#0f766e;--b:#c2410c;--c:#9fb3c1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a21;--card:#16252e;--ink:#e6edf1;--mut:#97a7b2;--line:#27394380;--a:#2dd4bf;--b:#fb923c;--c:#4a6272}}
:root[data-theme="dark"]{--bg:#0f1a21;--card:#16252e;--ink:#e6edf1;--mut:#97a7b2;--line:#27394380;--a:#2dd4bf;--b:#fb923c;--c:#4a6272}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 10px}.sub{color:var(--mut);margin:2px 0 16px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}.up{border:0;background:var(--a);color:var(--bg);padding:10px 16px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer}.st{color:var(--mut);margin:0 0 12px}.st.err{color:var(--b)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:6px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}button:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}.kpi small{color:var(--mut)}.kpi b{display:block;font-size:24px;font-weight:600;margin-top:2px}
.kpi.main b{color:var(--a);font-size:34px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.cv{position:relative;height:250px}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500}tfoot td{font-weight:600}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--a);vertical-align:middle;margin-right:6px}.neg{color:var(--b)}
.fr>span:first-child{white-space:nowrap}.fr{display:grid;grid-template-columns:70px 1fr 100px 130px 70px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.fr>span:nth-child(n+3),.fr>b{text-align:right}.fh{color:var(--mut);font-weight:500;font-size:12px}.ft{display:flex;justify-content:center}.fm{height:30px;background:var(--c);border-radius:4px;display:flex;align-items:center;justify-content:center;min-width:24px}.fa{height:100%;background:var(--a);border-radius:4px}@media(max-width:760px){.fr{grid-template-columns:56px 1fr 52px 68px 52px;gap:6px;font-size:12px}}
.tabs{display:flex;gap:6px;max-width:1100px;margin:0 auto;padding:12px 16px 0}.tabs button{border:0;border-bottom:3px solid transparent;background:none;color:var(--mut);padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}.tabs button[aria-pressed=true]{color:var(--ink);border-color:var(--a)}
.pg{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 4px}.pg i{display:block;height:100%;background:var(--a)}.mi{margin-bottom:16px}.chk{list-style:none;padding:0;margin:0}.chk li{padding:8px 0;border-bottom:1px solid var(--line)}.tag{display:inline-block;min-width:72px;font-weight:600}.tag.ok{color:var(--a)}.tag.w{color:var(--b)}.tag.i{color:var(--mut)}select{font:inherit;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#t2 .kpi b{font-size:20px;overflow-wrap:anywhere}#t2 .kpi.main b{font-size:30px}#pbt4 td:nth-child(2),#pbt4 th:nth-child(2){text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;min-height:30px}.chip{border:1px solid var(--a);color:var(--ink);background:none;border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}.chip b{color:var(--a)}tr.clk{cursor:pointer}tr.clk:hover td{background:var(--line)}tr.sel td{background:var(--line);font-weight:600}.rb{display:inline-block;height:6px;border-radius:3px;background:var(--a);vertical-align:middle;margin-right:8px}
.fbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-bottom:14px}.fbar label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}.fbar select{min-width:120px}.fbar select:disabled{opacity:.5}.fbar .fnote{flex-basis:100%;margin:0;font-size:12px;color:var(--mut)}.seg button:disabled{opacity:.4;cursor:not-allowed}
</style></head><body><nav class="tabs" aria-label="Painéis"><button id="tb1" aria-pressed="true">Sumário executivo</button><button id="tb2" aria-pressed="false">Posição banco</button></nav><main id="t1">
